<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeQuest</title>
<meta name="description" content="Ta vie comme un jeu vidéo : XP, niveaux, quêtes quotidiennes et boss. 100 % local, hors ligne.">
<meta name="theme-color" content="#0E0B16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  color-scheme: dark;
  --bg: #0E0B16;
  --card: #181425;
  --card2: #211B33;
  --line: #2E2745;
  --txt: #F4F1FA;
  --mut: #A9A2BF;
  --dim: #7A7394;
  --gold: #FBBF24;
  --xp: #8B5CF6;
  --hp: #F43F5E;
  --ok: #34D399;
  --force: #F87171;
  --intel: #60A5FA;
  --charisme: #F472B6;
  --discipline: #A78BFA;
  --richesse: #FBBF24;
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--txt); }
body {
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: var(--txt); }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
.hidden { display: none !important; }

/* ---------- Héros ---------- */
.hero {
  background: linear-gradient(160deg, #241B3D, var(--card) 60%);
  border: 1px solid var(--line); border-radius: 22px; padding: 16px;
  position: relative; overflow: hidden;
}
.hero-top { display: flex; gap: 14px; align-items: center; }
.avatar {
  width: 76px; height: 76px; border-radius: 18px; flex: none;
  background: var(--card2); border: 3px solid var(--rank, var(--xp));
  image-rendering: pixelated; object-fit: cover;
  box-shadow: 0 0 0 4px rgba(0,0,0,.25), 0 0 22px -4px var(--rank, var(--xp));
}
.hero-name { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.hero-rank { color: var(--rank, var(--xp)); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.lvl-badge {
  margin-left: auto; text-align: center; flex: none;
  background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px;
}
.lvl-badge b { display: block; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.lvl-badge span { font-size: 10px; color: var(--mut); text-transform: uppercase; letter-spacing: .1em; }
.bars { margin-top: 14px; display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.bar-row .lab { font-weight: 800; color: var(--mut); }
.bar-row .val { color: var(--mut); font-variant-numeric: tabular-nums; min-width: 74px; text-align: right; }
.bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar.xp > i { background: linear-gradient(90deg, #7C3AED, #A78BFA); }
.bar.hp > i { background: linear-gradient(90deg, #E11D48, #FB7185); }
.hero-foot { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.hero-foot .chip { padding: 4px 8px; font-size: 12.5px; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.06); border: 1px solid var(--line);
  border-radius: 99px; padding: 4px 10px; font-size: 13px; font-weight: 600;
}
.chip.gold { color: var(--gold); }

/* ---------- Sections ---------- */
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); margin: 22px 4px 10px; display: flex; align-items: center; gap: 8px; }
h2 .count { color: var(--dim); font-weight: 600; }
h2 .sp { flex: 1; }
.quote {
  margin-top: 14px; padding: 12px 14px; border-left: 3px solid var(--xp);
  background: var(--card); border-radius: 0 12px 12px 0; color: var(--mut); font-size: 14px;
}
.quote b { color: var(--txt); font-weight: 600; }
.list { display: grid; gap: 8px; }
.item {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px; transition: transform .15s, opacity .2s;
}
.item.done { opacity: .55; }
.item.done .it-title { text-decoration: line-through; text-decoration-color: var(--dim); }
.check {
  width: 34px; height: 34px; border-radius: 11px; flex: none;
  border: 2px solid var(--sc, var(--xp)); background: transparent;
  display: grid; place-items: center; font-size: 18px; font-weight: 900; color: var(--bg);
  transition: background .15s, transform .1s;
}
.check:active { transform: scale(.9); }
.item.done .check { background: var(--sc, var(--xp)); }
.it-body { flex: 1; min-width: 0; }
.it-title { font-weight: 600; overflow-wrap: anywhere; }
.it-meta { display: flex; gap: 10px; font-size: 12px; color: var(--mut); margin-top: 2px; flex-wrap: wrap; }
.it-meta .st { color: var(--sc); font-weight: 700; }
.more { background: none; border: 0; color: var(--dim); font-size: 20px; padding: 4px 6px; border-radius: 8px; flex: none; }
.more:hover { color: var(--txt); background: var(--card2); }
.empty { text-align: center; color: var(--dim); padding: 22px 12px; border: 1px dashed var(--line); border-radius: var(--r); font-size: 14px; }
.btn {
  border: 1px solid var(--line); background: var(--card2); border-radius: 12px;
  padding: 10px 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--xp); border-color: var(--xp); color: #fff; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1A1300; }
.btn.danger { color: var(--hp); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

/* ---------- Boss ---------- */
.boss {
  background: linear-gradient(160deg, #2A1220, var(--card) 70%);
  border: 1px solid #4A2036; border-radius: 20px; padding: 14px;
}
.boss.dead { background: var(--card); border-color: var(--line); opacity: .7; }
.boss-top { display: flex; gap: 12px; align-items: center; }
.boss img { width: 60px; height: 60px; border-radius: 14px; background: #1C0F18; flex: none; }
.boss .name { font-weight: 800; font-size: 17px; overflow-wrap: anywhere; }
.boss .alias { color: var(--mut); font-size: 13px; font-style: italic; }
.boss .bar { height: 12px; margin: 12px 0 8px; }
.boss .bar > i { background: linear-gradient(90deg, #BE123C, #FB7185); }
.boss-foot { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mut); }
.boss-foot .sp { flex: 1; }
.late { color: var(--hp); font-weight: 700; }
.shake { animation: shake .35s; }
@keyframes shake { 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }

/* ---------- Boutique / Profil ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.reward { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.reward .em { font-size: 28px; }
.reward .t { font-weight: 700; flex: 1; overflow-wrap: anywhere; }
.stat-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat-card .hd { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.stat-card .hd .lv { margin-left: auto; color: var(--sc); font-variant-numeric: tabular-nums; }
.stat-card .sub { font-size: 12px; color: var(--dim); margin: 2px 0 8px; }
.stat-card .bar > i { background: var(--sc); }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.ach div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; font-size: 12px; color: var(--mut); }
.ach div b { display: block; font-size: 26px; filter: grayscale(1) opacity(.3); }
.ach div.on { border-color: #5B4A1E; color: var(--txt); background: linear-gradient(160deg, #2A2110, var(--card)); }
.ach div.on b { filter: none; }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: rgba(255,255,255,.05); }
.log { font-size: 13px; color: var(--mut); display: grid; gap: 6px; }
.log div { display: flex; gap: 8px; }
.log time { color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }
.settings { display: grid; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.toggle span { flex: 1; }
.toggle small { display: block; color: var(--dim); }
.toggle input { width: 20px; height: 20px; accent-color: var(--xp); }

/* ---------- Navigation ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: rgba(14,11,22,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs button { background: none; border: 0; border-radius: 12px; padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--dim); display: grid; justify-items: center; gap: 2px; }
nav.tabs button b { font-size: 21px; filter: grayscale(.8); }
nav.tabs button.on { color: var(--txt); background: var(--card2); }
nav.tabs button.on b { filter: none; }
.fab {
  position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 21;
  width: 56px; height: 56px; border-radius: 18px; border: 0;
  background: var(--xp); color: #fff; font-size: 30px; line-height: 1;
  box-shadow: 0 10px 24px -6px rgba(139,92,246,.7);
}

/* ---------- Feuille (modale) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
  background: var(--card); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  animation: up .2s cubic-bezier(.2,.8,.2,1);
}
.sheet h3 { margin: 0 0 14px; font-size: 18px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 12px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
.field input[type=text], .field input[type=number], .field input[type=date] {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; outline: none;
}
.field input:focus { border-color: var(--xp); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--mut); }
.opts button.on { border-color: var(--sc, var(--xp)); color: var(--txt); background: var(--card2); box-shadow: inset 0 0 0 1px var(--sc, var(--xp)); }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; }
.field textarea { width: 100%; min-height: 140px; resize: vertical; background: var(--bg); color: var(--txt); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; outline: none; }
.field textarea:focus { border-color: var(--xp); }
.sheet p.note { color: var(--mut); font-size: 14px; margin: 0 0 16px; }

/* ---------- Toasts / overlays ---------- */
#toasts { position: fixed; top: 12px; left: 0; right: 0; z-index: 60; display: grid; justify-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px -10px #000; animation: toast 2.6s forwards; max-width: 100%; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-10px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8,6,14,.86); display: grid; place-items: center; padding: 24px; animation: fade .2s; }
.overlay .box { text-align: center; max-width: 340px; }
.overlay .big { font-size: 64px; line-height: 1; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
.overlay h1 { margin: 12px 0 6px; font-size: 28px; }
.overlay p { color: var(--mut); margin: 0 0 18px; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 55; border-radius: 2px; animation: fall linear forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

/* ---------- Accueil ---------- */
.onb { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.onb .box { width: 100%; max-width: 420px; text-align: center; }
.onb h1 { font-size: 32px; margin: 8px 0 4px; letter-spacing: -.02em; }
.onb p { color: var(--mut); margin: 0 0 22px; }
.onb .avatar { width: 112px; height: 112px; border-radius: 26px; margin: 0 auto 6px; display: block; }
.onb .field { text-align: left; }
.styles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.styles button { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 6px; }
.styles button.on { border-color: var(--xp); }
.styles img { width: 100%; aspect-ratio: 1; border-radius: 10px; display: block; image-rendering: pixelated; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

/* =========================================================

   ========================================================= */
function curve(base, step, xp) {
  var lvl = 1, need = base, rest = Math.max(0, xp);
  while (rest >= need) { rest -= need; lvl++; need = base + (lvl - 1) * step; }
  return { lvl: lvl, cur: rest, need: need };
}
function levelOf(xp) { return curve(100, 50, xp); }

  ["dailies", "quests", "bosses", "rewards", "log"].forEach(function (k) { if (!Array.isArray(s[k])) s[k] = []; });

/* =========================================================
   Passage au jour suivant : dégâts des quotidiennes ratées
   ========================================================= */
function rollover() {
  var t = today();
  if (!S.lastDay || S.lastDay >= t) { S.lastDay = S.lastDay || t; return; }
  var gap = daysBetween(S.lastDay, t);
  var missed = [], dmg = 0, bossHits = [];
  if (!S.pause) {
    S.dailies.forEach(function (d) {
      if (d.created > S.lastDay) return;
      if (d.doneOn !== S.lastDay || gap > 1) {
        if (d.doneOn !== S.lastDay) { missed.push(d.title); dmg += DIFF[d.diff].dmg; }
        d.streak = 0;
      }
    });
    S.bosses.forEach(function (b) {
      if (b.defeatedAt || !b.deadline || b.deadline >= t) return;
      var late = Math.min(daysBetween(b.deadline > S.lastDay ? b.deadline : S.lastDay, t), 3);
      if (late > 0) { dmg += 5 * late; bossHits.push(b.name); }
    });
  }
  S.lastDay = t;
  if (!dmg) { save(); return; }
  S.hp -= dmg;
  log("💥 −" + dmg + " PV (quêtes ratées)");
  var ko = S.hp <= 0;
  if (ko) {
    var lost = Math.floor(S.gold / 2);
    S.gold -= lost; S.hp = MAXHP;
    log("☠️ K.O. ! −" + lost + " or");
  }
  save();
  setTimeout(function () {
    overlay(ko ? "☠️" : "💥", ko ? "K.O. !" : "Aïe… −" + dmg + " PV",
      (missed.length ? "Quêtes ratées hier : " + missed.map(esc).join(", ") + "." : "") +
      (bossHits.length ? " Boss en retard qui t'attaquent : " + bossHits.map(esc).join(", ") + "." : "") +
      (ko ? " Tu perds la moitié de ton or, mais tu repars avec tous tes PV." : " Les PV remontent quand tu termines des quêtes."),
      "Je me relève");
  }, 300);
}

function gain(st, xp, gold, label) {

  S.history[day] = (S.history[day] || 0) + 1;
  log("✅ " + label + " (+" + xp + " XP, +" + gold + " or)");
  toast("+" + xp + " XP " + stat(st).i + "  ·  +" + gold + " 🪙");
  buzz();
  var after = levelOf(S.xp).lvl;
  if (after > before) {
    S.hp = MAXHP;
    log("⬆️ Niveau " + after + " !");
    var r = rankOf(after), rb = rankOf(before);
    setTimeout(function () {
      confetti();
      overlay("⬆️", "Niveau " + after + " !", r.n !== rb.n ? "Nouveau rang : <b style=\"color:" + r.c + "\">" + r.n + "</b>. Tes PV sont restaurés." : "Tes PV sont restaurés. Continue comme ça !", "Continuer");
    }, 250);
  }
}

function bindOpts(root, state) {
  root.querySelectorAll(".opts").forEach(function (g) {

// Nom de monstre aléatoire via Open5e (3 000+ monstres), avec une liste de secours hors ligne.
function randomMonster(input, btn) {
  btn.disabled = true; btn.textContent = "⏳";
  var done = function (name) { input.value = name; btn.disabled = false; btn.textContent = "🎲"; };
  var page = 1 + Math.floor(Math.random() * 3000);
  var ctrl = "AbortController" in window ? new AbortController() : null;
  var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 5000);
  fetch("https://api.open5e.com/v1/monsters/?limit=1&page=" + page, ctrl ? { signal: ctrl.signal } : {})
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) { clearTimeout(to); var m = j.results && j.results[0]; if (!m || !m.name) throw 0; done(m.name); })
    .catch(function () { clearTimeout(to); done(MONSTERS_FR[Math.floor(Math.random() * MONSTERS_FR.length)]); });
}

function toast(msg) {

function overlay(icon, title, html, cta) {

function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var colors = ["#8B5CF6", "#FBBF24", "#F472B6", "#34D399", "#60A5FA"];
  for (var i = 0; i < 60; i++) {
    var c = document.createElement("i");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
    c.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(c);
    setTimeout(function (el) { el.remove(); }.bind(null, c), 3800);
  }
}

    $("#exCopy", root).addEventListener("click", function () {
      var ok = function () { toast("📋 Sauvegarde copiée"); };
      var fallback = function () { ta.focus(); ta.select(); toast("Texte sélectionné : copie-le avec Ctrl+C ou un appui long"); };
      try { navigator.clipboard.writeText(json).then(ok, fallback); } catch (e) { fallback(); }
    });
    if (canDownload) $("#exFile", root).addEventListener("click", function () {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
      a.download = "lifequest-sauvegarde-" + today() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    });
  });
}
function importSheet() {
  sheet("<h3>Importer une partie</h3><p class=\"note\">Colle le texte d'une sauvegarde, ou choisis un fichier .json. Ta partie actuelle sera remplacée.</p>" +
    '<label class="field"><span>Texte de la sauvegarde</span><textarea id="imText" placeholder="{&quot;v&quot;:1,…}"></textarea></label>' +
    '<div class="row"><button class="btn" id="imFile">Choisir un fichier</button><button class="btn primary" id="imGo">Importer</button></div>' +
    '<input type="file" id="importFile" accept="application/json,.json" class="hidden">', function (root) {
    $("#imFile", root).addEventListener("click", function () { $("#importFile", root).click(); });
    $("#importFile", root).addEventListener("change", function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { applyImport(r.result); };
      r.readAsText(f);
    });
    $("#imGo", root).addEventListener("click", function () { applyImport($("#imText", root).value); });
  });
}
function applyImport(text) {
  var s;
  try { s = JSON.parse(text); if (!s || !s.hero) throw 0; }
  catch (e) { toast("❌ Ce texte n'est pas une sauvegarde LifeQuest"); return; }
  S = normalize(s); rollover(); save(); closeSheet(); render(); toast("⬆️ Partie importée : bon retour, " + S.hero.name + " !");
}
function askConfirm(title, html, okLabel, fn) {
  sheet("<h3>" + esc(title) + '</h3><p class="note">' + html + "</p>" +
    '<div class="row"><button class="btn" id="cfNo">Annuler</button><button class="btn danger" id="cfYes">' + esc(okLabel) + "</button></div>", function (root) {
    $("#cfNo", root).addEventListener("click", closeSheet);
    $("#cfYes", root).addEventListener("click", function () { closeSheet(); fn(); });
  });
}

/* =========================================================
   Événements
   ========================================================= */
document.addEventListener("click", function (e) {
  var tb = e.target.closest("[data-tab]");
  if (tb) {
    tab = tb.dataset.tab;
    try { localStorage.setItem(KEY + ".tab", tab); } catch (err) {}
    render(); window.scrollTo(0, 0); return;
  }
  var el = e.target.closest("[data-act]");
  if (!el || !S) return;
  var id = el.dataset.id;
  switch (el.dataset.act) {
    case "daily": A.toggleDaily(id); break;
    case "quest": A.toggleQuest(id); break;
    case "clear-done": A.clearDone(); break;
    case "attack": A.attack(id); break;
    case "buy": A.buy(id); break;
    case "bonus": A.bonus(); break;
    case "edit-daily": questSheet("daily", find(S.dailies, id)); break;
    case "edit-quest": questSheet("quest", find(S.quests, id)); break;
    case "edit-boss": bossSheet(find(S.bosses, id)); break;
    case "edit-reward": rewardSheet(find(S.rewards, id)); break;
    case "edit-hero": heroSheet(); break;
    case "export": exportSave(); break;
    case "import": importSheet(); break;
    case "reset":
      askConfirm("Recommencer à zéro ?", "Ton héros, tes niveaux, ton or et tes quêtes seront effacés. Exporte ta partie avant si tu veux la garder.", "Tout effacer", function () {
        try { localStorage.removeItem(KEY); } catch (err) {}
        S = null; onb = { name: "", style: "pixel-art" }; tab = "quetes"; render();
      });
      break;
    case "add":
      if (tab === "boss") bossSheet();
      else if (tab === "boutique") rewardSheet();
      else questSheet("daily");
      break;
  }
});
document.addEventListener("change", function (e) {
  if (!S) return;
  if (e.target.dataset.act === "pause") {
    S.pause = e.target.checked;
    log(S.pause ? "🏖️ Mode pause activé" : "⚔️ Retour à l'aventure");
    commit();
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
// Si l'app reste ouverte après minuit, on passe au jour suivant au retour.
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && S && S.lastDay < today()) { rollover(); render(); }
});

/* =========================================================
   Démarrage
   ========================================================= */
S = load();
if (S) rollover();
render();
loadAvatarLib();

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
